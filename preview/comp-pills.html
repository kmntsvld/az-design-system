<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-wrap"><div class="label-xs">Pills & segmented controls</div>
<div class="row" style="gap:8px;align-items:center">
  <span style="padding:4px 14px;border-radius:20px;font:600 12px var(--font-body);background:#830051;color:#fff;border:1px solid #830051">2026</span>
  <span style="padding:4px 14px;border-radius:20px;font:600 12px var(--font-body);background:transparent;color:var(--light-text-secondary);border:1px solid var(--light-border-strong)">2027</span>
  <span style="padding:4px 12px;border-radius:20px;font:500 12px var(--font-body);background:#830051;color:#fff;border:1px solid #830051">Все</span>
  <span style="padding:4px 12px;border-radius:20px;font:500 12px var(--font-body);background:transparent;color:var(--light-text-secondary);border:1px solid var(--light-border-strong)">PMO</span>
  <span style="padding:4px 12px;border-radius:20px;font:500 12px var(--font-body);background:transparent;color:var(--light-text-secondary);border:1px solid var(--light-border-strong)">AI</span>
</div>
<div style="display:inline-flex;background:#f1f5f9;border-radius:8px;padding:3px;gap:2px;width:max-content">
  <span style="padding:4px 12px;border-radius:6px;font:500 12px var(--font-body);background:#fff;color:#830051;box-shadow:0 1px 3px rgba(0,0,0,.1)">FTE %</span>
  <span style="padding:4px 12px;border-radius:6px;font:500 12px var(--font-body);background:transparent;color:#64748b">Ч/д</span>
</div></div>
</body></html>
