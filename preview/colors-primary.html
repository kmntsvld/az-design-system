<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">

</head>
<body>
<div class="card-wrap"><div class="label-xs">Primary — use freely</div><div class="row">
  <div class="sw" style="flex:1;min-width:96px"><div class="chip" style="background:#830051;color:rgba(255,255,255,0.9)"></div><div class="name">Mulberry</div><div class="hex">#830051</div><div class="role">primary</div></div>

  <div class="sw" style="flex:1;min-width:96px"><div class="chip" style="background:#f0ab00;color:rgba(0,0,0,0.55)"></div><div class="name">Gold</div><div class="hex">#f0ab00</div><div class="role">signal / total</div></div>
