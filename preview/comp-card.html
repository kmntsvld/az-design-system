<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .ico svg { width: 18px; height: 18px; stroke-width: 2; }
</style>
</head>
<body>
<div class="card-wrap">
  <div class="label-xs">Card with head</div>
  <div style="background:#fff;border:1px solid var(--light-border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:560px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#fafbfb;border-bottom:1px solid var(--light-border)">
      <div style="display:flex;align-items:center;gap:9px;font:700 15px var(--font-display);color:var(--light-text)"><span class="ico" style="color:var(--color-mulberry);display:inline-flex"><i data-lucide="target"></i></span>Годовой план</div>
      <div style="font-size:11px;color:var(--light-text-muted)">Efficiency target · 2025–2028</div>
    </div>
    <div style="padding:18px;font-size:12.5px;color:var(--light-text-secondary)">Solid surface · 1px hairline border · 14px radius · subtle shadow. Data, not elevation, is the focus.</div>
  </div>
</div>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
