<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-wrap"><div class="label-xs">Status semantics — plan vs fact</div><div class="col" style="gap:8px">
  <div style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;align-items:center;gap:6px;background:#e6eef5;color:#003865;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px"><span class="dot" style="background:#003865;width:8px;height:8px"></span>Over</span><span style="font-size:11px;color:var(--light-text-secondary)">Overachieved</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--light-text-muted)">#003865</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;align-items:center;gap:6px;background:#e2f3d8;color:#2f6f1d;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px"><span class="dot" style="background:#3f9e2c;width:8px;height:8px"></span>On track</span><span style="font-size:11px;color:var(--light-text-secondary)">On Track</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--light-text-muted)">#3f9e2c</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;align-items:center;gap:6px;background:#fdf1d6;color:#8a6200;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px"><span class="dot" style="background:#f0ab00;width:8px;height:8px"></span>Risk</span><span style="font-size:11px;color:var(--light-text-secondary)">At Risk</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--light-text-muted)">#f0ab00</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;align-items:center;gap:6px;background:#fbe0ee;color:#d0006f;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px"><span class="dot" style="background:#d0006f;width:8px;height:8px"></span>Off</span><span style="font-size:11px;color:var(--light-text-secondary)">Off Track</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--light-text-muted)">#d0006f</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;align-items:center;gap:6px;background:#eef1f0;color:#8a9693;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px"><span class="dot" style="background:#9db0ac;width:8px;height:8px"></span>No data</span><span style="font-size:11px;color:var(--light-text-secondary)">No Data</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--light-text-muted)">#9db0ac</span></div>
</div></div>
</body></html>
