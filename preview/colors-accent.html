<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-wrap"><div class="label-xs">Illuminating accents — small accents / data-viz only</div><div class="row">
  <div class="sw" style="flex:1;min-width:96px"><div class="chip" style="background:#3c1053;color:rgba(255,255,255,0.9)"></div><div class="name">Purple</div><div class="hex">#3c1053</div><div class="role">accent</div></div>
  <div class="sw" style="flex:1;min-width:96px"><div class="chip" style="background:#003865;color:rgba(255,255,255,0.9)"></div><div class="name">Navy</div><div class="hex">#003865</div><div class="role">accent / over</div></div>
  <div class="sw" style="flex:1;min-width:96px"><div class="chip" style="background:#68d2df;color:rgba(0,0,0,0.55)"></div><div class="name">Light Blue</div><div class="hex">#68d2df</div><div class="role">accent</div></div>
  <div class="sw" style="flex:1;min-width:96px"><div class="chip" style="background:#c4d600;color:rgba(0,0,0,0.55)"></div><div class="name">Lime Green</div><div class="hex">#c4d600</div><div class="role">accent / on-track</div></div>
</div><div style="font-size:10.5px;color:var(--light-text-muted)">Brandbook rule: never as background or body text.</div></div>
</body></html>
