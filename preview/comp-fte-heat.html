<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-wrap">
  <div class="label-xs">FTE heat scale — functional data-viz (non-brand) · 100% = ideal</div>
  <div class="row" style="gap:0;border-radius:8px;overflow:hidden;max-width:620px">
    <div style="flex:1;height:48px;background:#f1f5f9;color:#cbd5e1;display:flex;align-items:center;justify-content:center;font:700 11px var(--font-body)">0%</div>
    <div style="flex:1;height:48px;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font:700 11px var(--font-body)">≤25%</div>
    <div style="flex:1;height:48px;background:#fb923c;color:#7c2d12;display:flex;align-items:center;justify-content:center;font:700 11px var(--font-body)">≤50%</div>
    <div style="flex:1;height:48px;background:#fde68a;color:#78350f;display:flex;align-items:center;justify-content:center;font:700 11px var(--font-body)">≤75%</div>
    <div style="flex:1;height:48px;background:#86efac;color:#14532d;display:flex;align-items:center;justify-content:center;font:700 11px var(--font-body)">≤100%</div>
    <div style="flex:1;height:48px;background:#fde68a;color:#78350f;display:flex;align-items:center;justify-content:center;font:700 11px var(--font-body)">≤110%</div>
    <div style="flex:1;height:48px;background:#f87171;color:#7f1d1d;display:flex;align-items:center;justify-content:center;font:700 11px var(--font-body)">&gt;110%</div>
  </div>
  <div style="font-size:10.5px;color:var(--light-text-muted)">Diverging around full utilisation: grey = idle, orange/amber = under-loaded, green = ideal ≈100%, amber→red = over-loaded. Functional — kept distinct from the brand palette.</div>
</div>
</body></html>
