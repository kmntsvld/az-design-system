<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-wrap"><div class="label-xs">Level badges & status chips</div>
<div class="row" style="gap:8px;align-items:center">
  <span style="background:#f0ab00;color:#4d0030;font:700 9px var(--font-body);text-transform:uppercase;letter-spacing:0.04em;padding:2px 6px;border-radius:4px">L1</span>
  <span style="background:#eceeed;color:#3f4444;font:700 9px var(--font-body);text-transform:uppercase;padding:2px 6px;border-radius:4px">L2</span>
  <span style="border:1px solid var(--light-border-strong);color:var(--light-text-muted);font:700 9px var(--font-body);text-transform:uppercase;padding:1px 5px;border-radius:4px">L3</span>
  <span style="border:1px dashed var(--light-border-strong);color:var(--light-text-muted);font:700 9px var(--font-body);text-transform:uppercase;padding:1px 5px;border-radius:4px">L4</span>
</div>
<div class="row" style="gap:8px;align-items:center">
  <span style="display:inline-flex;gap:6px;align-items:center;background:#e2f3d8;color:#2f6f1d;font:700 11px var(--font-body);padding:3px 9px;border-radius:20px"><span class="dot" style="width:8px;height:8px;background:#3f9e2c"></span>On track</span>
  <span style="display:inline-flex;gap:6px;align-items:center;background:#fdf1d6;color:#8a6200;font:700 11px var(--font-body);padding:3px 9px;border-radius:20px"><span class="dot" style="width:8px;height:8px;background:#f0ab00"></span>Risk</span>
  <span style="display:inline-flex;gap:6px;align-items:center;background:#fbe0ee;color:#d0006f;font:700 11px var(--font-body);padding:3px 9px;border-radius:20px"><span class="dot" style="width:8px;height:8px;background:#d0006f"></span>Off track</span>
</div></div>
</body></html>
