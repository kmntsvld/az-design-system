<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pft { border-collapse: collapse; width: 100%; max-width: 620px; font-family: var(--font-body); }
  .pft th { text-align: right; padding: 8px 12px; font: 700 9.5px var(--font-body); text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--light-text-muted); border-bottom: 1px solid var(--light-border-strong); background: #fafbfb; }
  .pft th.l { text-align: left; }
  .pft th.roll { color: #c08a00; background: rgba(240,171,0,.06); }
  .pft td { padding: 7px 12px; border-bottom: 1px solid var(--light-border); }
  /* numerics share the metric-name font (Inter) with tabular figures */
  .pft td.num { text-align: right; font-family: var(--font-body); font-variant-numeric: tabular-nums;
    font-size: 12.5px; font-feature-settings: "tnum" 1; }
  .pft .plan { color: var(--light-text-muted); }
  .pft .sep { color: var(--light-text-muted); margin: 0 4px; }
  .pft .fact { font-weight: 700; color: var(--light-text); }
  .pft td.roll { text-align: right; font-family: var(--font-body); font-variant-numeric: tabular-nums;
    font-size: 12.5px; font-weight: 700; color: #b07d00; background: rgba(240,171,0,.06); }
  .pft .lvl { display:inline-block; font:700 9px var(--font-body); padding:2px 6px; border-radius:4px; margin-right:7px; text-transform:uppercase; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="card-wrap">
  <div class="label-xs">Table — plan / fact / Δ</div>
  <div style="border:1px solid var(--light-border);border-radius:12px;overflow:hidden;max-width:620px">
    <table class="pft">
      <thead>
        <tr>
          <th class="l">Метрика</th>
          <th>1Q26 План/Факт</th>
          <th class="roll">2026 Итог</th>
        </tr>
      </thead>
      <tbody>
        <tr style="background:#f7eef4">
          <td><span class="lvl" style="background:#f0ab00;color:#4d0030">L1</span>Effect $ m</td>
          <td class="num"><span class="plan">$0.20m</span><span class="sep">/</span><span class="fact">$0.18m</span></td>
          <td class="roll">$5.70m</td>
        </tr>
        <tr>
          <td><span class="lvl" style="background:#eceeed;color:#3f4444">L2</span>OCM adoption</td>
          <td class="num"><span class="plan">$0.90m</span><span class="sep">/</span><span class="fact">$0.84m</span></td>
          <td class="roll">$2.10m</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body></html>
