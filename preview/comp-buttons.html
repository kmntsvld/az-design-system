<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-wrap"><div class="label-xs">Buttons</div><div class="row" style="align-items:center;gap:14px">
  <button style="background:#830051;color:#fff;border:none;border-radius:9px;padding:9px 16px;font:700 12.5px var(--font-body);letter-spacing:0.01em;cursor:pointer">⬆ Загрузить Data</button>
  <button style="background:#4d0030;color:#fff;border:none;border-radius:9px;padding:9px 16px;font:700 12.5px var(--font-body);cursor:pointer">Hover</button>
  <button style="background:#fff;color:var(--light-text-secondary);border:1px solid var(--light-border-strong);border-radius:7px;padding:6px 11px;font:600 11.5px var(--font-body);cursor:pointer">⚙ Колонки</button>
  <button style="background:#fff;color:var(--color-mulberry);border:1px solid var(--color-mulberry);border-radius:7px;padding:6px 11px;font:600 11.5px var(--font-body);cursor:pointer">Tool · hover</button>
</div>
<div class="row" style="gap:18px;font-size:10.5px;color:var(--light-text-muted)"><span>Primary → hover darkens to Dark&nbsp;Mulberry</span><span>Tool → border + text shift to Mulberry</span></div></div>
</body></html>
